name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Static analysis (lint + types)
  # Runs on a single Python version — quality checks are not
  # version-sensitive and this keeps CI fast.
  # ──────────────────────────────────────────────────────────────
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: ruff — lint
        run: ruff check pqhe/ tests/

      - name: mypy — type check
        run: mypy pqhe/

  # ──────────────────────────────────────────────────────────────
  # Job 2: Test matrix
  # Runs unit tests, then integration tests, then the full suite
  # with coverage enforcement (≥80%).  fail-fast: false means
  # both Python versions run to completion even if one fails.
  # ──────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # liboqs-python builds the native liboqs into ~/_oqs on first import.
      # Cache it so only the first run per liboqs-python version pays for the build.
      - name: Get liboqs-python version
        id: oqs
        run: echo "version=$(pip show liboqs-python | awk '/^Version/{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/_oqs
          key: liboqs-${{ runner.os }}-${{ steps.oqs.outputs.version }}

      # Fail fast if ML-KEM-768 is unusable, so the PQ tests can never be silently skipped.
      - name: Build liboqs and verify ML-KEM-768
        run: python -c "from pqhe.crypto.post_quantum import ml_kem; assert ml_kem.is_available(), 'ML-KEM-768 unavailable'"

      - name: Unit tests
        run: pytest -m unit --no-cov

      - name: Integration tests
        run: pytest -m integration --no-cov

      - name: Full suite + coverage gate (≥80%)
        run: pytest --cov-report=xml

      - name: Upload HTML coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 7
